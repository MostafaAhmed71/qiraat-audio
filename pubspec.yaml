name: qiraat_audio
description: Arabic offline-first Quran audio browser with source-audited riwayat.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: 16.2.4
  just_audio: 0.10.5
  just_audio_background: 0.0.1-beta.17
  audio_service: 0.18.18
  dio: 5.9.0
  path_provider: 2.1.5
  shared_preferences: 2.5.3
  idb_shim: 2.6.6
  web: 1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf
